<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Throttler - File Explorer</title>
  <meta name="description" content="A web-based file explorer clone that allows you to navigate a virtual file system, inspired by the Windows Explorer interface." />
  <meta property="og:title" content="Throttler - File Explorer" />
  <meta property="og:description" content="A web-based file explorer clone that allows you to navigate a virtual file system, inspired by the Windows Explorer interface." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root, body.theme-light, body.theme-system {
      --color-background: 248 250 252;
      --color-surface-base: 255 255 255;
      --color-surface-muted: 241 245 249;
      --color-surface-hover: 226 232 240;
      --color-surface-input: 255 255 255;
      --color-surface-dialog: 255 255 255;

      --color-text-base: 15 23 42;
      --color-text-muted: 71 85 105;
      --color-text-subtle: 148 163 184;

      --color-border-base: 226 232 240;
      --color-border-input: 203 213 225;

      --color-accent-text: 37 99 235;
      --color-accent-bg: 239 246 255;
    }

    body.theme-dark {
      --color-background: 15 23 42;
      --color-surface-base: 30 41 59;
      --color-surface-muted: 15 23 42;
      --color-surface-hover: 51 65 85;
      --color-surface-input: 15 23 42;
      --color-surface-dialog: 30 41 59;

      --color-text-base: 248 250 252;
      --color-text-muted: 203 213 225;
      --color-text-subtle: 148 163 184;

      --color-border-base: 51 65 85;
      --color-border-input: 71 85 105;

      --color-accent-text: 96 165 250;
      --color-accent-bg: 30 58 138 / 0.4;
    }

    body.theme-midnight {
      --color-background: 3 7 18;
      --color-surface-base: 17 24 39;
      --color-surface-muted: 10 15 29;
      --color-surface-hover: 31 41 55;
      --color-surface-input: 10 15 29;
      --color-surface-dialog: 17 24 39;

      --color-text-base: 243 244 246;
      --color-text-muted: 156 163 175;
      --color-text-subtle: 107 114 128;

      --color-border-base: 31 41 55;
      --color-border-input: 55 65 81;

      --color-accent-text: 129 140 248;
      --color-accent-bg: 49 46 129 / 0.4;
    }

    body.theme-nord {
      --color-background: 46 52 64;
      --color-surface-base: 59 66 82;
      --color-surface-muted: 46 52 64;
      --color-surface-hover: 67 76 94;
      --color-surface-input: 46 52 64;
      --color-surface-dialog: 59 66 82;

      --color-text-base: 236 239 244;
      --color-text-muted: 216 222 233;
      --color-text-subtle: 147 161 161;

      --color-border-base: 67 76 94;
      --color-border-input: 76 86 106;

      --color-accent-text: 136 192 208;
      --color-accent-bg: 67 76 94 / 0.6;
    }

    body.theme-solarized {
      --color-background: 253 246 227;
      --color-surface-base: 255 255 255;
      --color-surface-muted: 238 232 213;
      --color-surface-hover: 220 216 198;
      --color-surface-input: 255 255 255;
      --color-surface-dialog: 255 255 255;

      --color-text-base: 7 54 66;
      --color-text-muted: 88 110 117;
      --color-text-subtle: 147 161 161;

      --color-border-base: 220 216 198;
      --color-border-input: 200 196 178;

      --color-accent-text: 181 137 0;
      --color-accent-bg: 253 246 227;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgb(var(--color-border-input));
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgb(var(--color-text-subtle));
    }

    /* Search Result Match Highlights */
    .search-highlight {
      background-color: rgba(245, 158, 11, 0.28);
      color: #92400e;
      font-weight: 600;
      border-radius: 2px;
      padding: 0 1px;
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.45);
    }
    body.theme-dark .search-highlight,
    body.theme-midnight .search-highlight,
    body.theme-nord .search-highlight {
      background-color: rgba(245, 158, 11, 0.35);
      color: #fde68a;
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.55);
    }
    body.theme-solarized .search-highlight {
      background-color: rgba(181, 137, 0, 0.25);
      color: #b58900;
      box-shadow: 0 0 0 1px rgba(181, 137, 0, 0.5);
    }
    [aria-selected="true"] .search-highlight {
      background-color: rgba(251, 191, 36, 0.45);
      color: #78350f;
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.7);
    }
    body.theme-dark [aria-selected="true"] .search-highlight,
    body.theme-midnight [aria-selected="true"] .search-highlight,
    body.theme-nord [aria-selected="true"] .search-highlight {
      background-color: rgba(251, 191, 36, 0.45);
      color: #fef08a;
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.85);
    }
  </style>
</head>
<body class="font-sans antialiased bg-[rgb(var(--color-background))] text-[rgb(var(--color-text-base))] overflow-hidden select-none">
  <div id="root" class="h-screen w-screen flex flex-col overflow-hidden"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
